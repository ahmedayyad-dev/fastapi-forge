name: fastapi-forge

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fastapi-forge:latest
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      FORGE_ENVIRONMENT: production
      FORGE_DEBUG: "false"
      FORGE_REDIS_URL: redis://redis:6379/0
      FORGE_LOG_JSON: "true"
      FORGE_LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health/live').status == 200 else 1)"
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
